<!doctype html>
<!-- The Agent Radar console. One page, plain HTML and JavaScript, no framework. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Radar</title>
<style>
  body { margin: 0; background: #f5f6f8; color: #15181d;
         font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { background: #fff; border-bottom: 1px solid #e2e5ea; padding: 14px 24px;
           display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 19px; margin: 0; }
  header p { margin: 0; color: #6b7280; font-size: 13.5px; }
  .grow { flex: 1; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #d5d9e0;
           background: #fff; cursor: pointer; }
  button:hover { background: #f1f3f6; }
  button.main { background: #2f5bd7; border-color: #2f5bd7; color: #fff; }
  main { padding: 22px 24px 60px; max-width: 1200px; }
  .switch { display: flex; border: 1px solid #d5d9e0; border-radius: 8px; overflow: hidden; }
  .switch button { border: 0; border-radius: 0; background: #fff; color: #4b5563; }
  .switch button + button { border-left: 1px solid #d5d9e0; }
  .switch button.on { background: #2f5bd7; color: #fff; }
  #banner { padding: 10px 24px; font-size: 14px; background: #fff7e6; border-bottom: 1px solid #f0e2c8; }
  #banner:empty { display: none; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px;
          padding: 12px 18px; min-width: 130px; }
  .stat b { display: block; font-size: 26px; line-height: 1.2; }
  .stat span { color: #6b7280; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border: 1px solid #e2e5ea; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eef0f3; font-size: 14px; }
  th { background: #f8f9fb; font-size: 12.5px; text-transform: uppercase;
       letter-spacing: .04em; color: #6b7280; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f8f9fb; }
  tbody tr.open { background: #eef3ff; }
  .score { display: inline-block; min-width: 34px; text-align: center; padding: 3px 8px;
           border-radius: 99px; font-weight: 700; font-size: 13px;
           background: #e9ecef; color: #495057; }
  .score.high { background: #fdecec; color: #c0281f; }
  .score.mid { background: #fff2e2; color: #b1560a; }
  code { background: #f1f3f6; padding: 1px 5px; border-radius: 4px;
         font: 12.5px ui-monospace, Consolas, monospace; }
  .muted { color: #6b7280; }
  #details { margin-top: 18px; background: #fff; border: 1px solid #e2e5ea;
             border-radius: 10px; padding: 18px 20px; }
  #details h2 { margin: 0 0 4px; font-size: 17px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; margin: 14px 0; font-size: 14px; }
  .kv div:nth-child(odd) { color: #6b7280; }
  .finding { border-left: 3px solid #c0281f; background: #fdf4f3; border-radius: 0 8px 8px 0;
             padding: 10px 14px; margin: 8px 0; }
  .finding.medium { border-left-color: #b1560a; background: #fff8f1; }
  .finding b { display: block; }
  .finding .fix { color: #4b5563; font-size: 13.5px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Agent Radar</h1>
  <p>AI agents found on developer machines</p>
  <span class="grow"></span>
  <div class="switch">
    <button id="useSample" data-source="sample">Sample machines</button>
    <button id="useMachine" data-source="machine">This computer</button>
  </div>
  <button id="rescan" class="main">Rescan</button>
</header>
<div id="banner"></div>

<main>
  <div class="stats" id="stats"></div>
  <table>
    <thead><tr>
      <th>Risk</th><th>Agent</th><th>Runs</th><th>Owners</th><th>Machines</th><th>Tools</th><th>Findings</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="details" hidden></div>
</main>

<script>
let agents = [];
let source = "sample";

function escapeHtml(text) {
  return String(text === null || text === undefined ? "" : text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function scoreClass(risk) {
  if (risk >= 70) return "score high";
  if (risk >= 40) return "score mid";
  return "score";
}

function commandLine(agent) {
  if (agent.url) return agent.url;
  return (agent.command + " " + agent.args.join(" ")).trim();
}

function showSource() {
  for (const button of document.querySelectorAll(".switch button")) {
    button.classList.toggle("on", button.dataset.source === source);
  }
  document.getElementById("banner").textContent = source === "machine"
    ? "Showing THIS computer - a real scan of your home folder."
    : "Showing the three sample machines in sample/ (made-up data for the demo).";
}

async function load() {
  const statsResponse = await fetch("/api/stats");
  const stats = await statsResponse.json();
  source = stats.source || "sample";
  showSource();
  document.getElementById("stats").innerHTML =
    box(stats.agents, "agents") + box(stats.risky_agents, "risky (70+)") +
    box(stats.devices, "machines") + box(stats.credentials, "credentials");

  const response = await fetch("/api/agents");
  agents = await response.json();

  let html = "";
  for (const agent of agents) {
    html += "<tr data-id='" + agent.agent_id + "'>" +
      "<td><span class='" + scoreClass(agent.risk) + "'>" + agent.risk + "</span></td>" +
      "<td><b>" + escapeHtml(agent.name) + "</b></td>" +
      "<td><code>" + escapeHtml(commandLine(agent).slice(0, 60)) + "</code></td>" +
      "<td>" + escapeHtml(agent.owners.join(", ")) + "</td>" +
      "<td>" + escapeHtml(agent.devices.join(", ")) + "</td>" +
      "<td>" + escapeHtml(agent.tools.join(", ")) + "</td>" +
      "<td>" + agent.findings.length + "</td></tr>";
  }
  if (agents.length === 0) {
    html = "<tr><td colspan='7' class='muted'>Nothing yet. Press Rescan, " +
           "or run: python scan.py sample/laptop-dana --upload http://127.0.0.1:8000</td></tr>";
  }
  document.getElementById("rows").innerHTML = html;

  for (const row of document.querySelectorAll("tbody tr[data-id]")) {
    row.onclick = function () { showDetails(row.dataset.id, row); };
  }
}

function box(value, label) {
  return "<div class='stat'><b>" + value + "</b><span>" + label + "</span></div>";
}

function showDetails(agentId, row) {
  for (const other of document.querySelectorAll("tbody tr")) other.classList.remove("open");
  row.classList.add("open");

  let agent = null;
  for (const candidate of agents) {
    if (candidate.agent_id === agentId) agent = candidate;
  }
  if (!agent) return;

  let html = "<h2>" + escapeHtml(agent.name) + " <span class='" + scoreClass(agent.risk) + "'>" +
             agent.risk + "</span></h2>";
  html += "<div class='muted'>" + escapeHtml(agent.agent_id) + "</div>";
  html += "<div class='kv'>";
  html += "<div>Runs</div><div><code>" + escapeHtml(commandLine(agent)) + "</code></div>";
  html += "<div>Owners</div><div>" + escapeHtml(agent.owners.join(", ")) + "</div>";
  html += "<div>Machines</div><div>" + escapeHtml(agent.devices.join(", ")) + "</div>";
  const paths = [];
  for (const path of agent.config_paths) paths.push(escapeHtml(path));
  html += "<div>Configured in</div><div>" + paths.join("<br>") + "</div>";
  html += "<div>Env variables</div><div>" +
          (agent.env_keys.length ? escapeHtml(agent.env_keys.join(", ")) : "<span class='muted'>none</span>") +
          "</div>";
  html += "<div>First seen</div><div>" + escapeHtml(agent.first_seen) + "</div>";
  html += "<div>Last seen</div><div>" + escapeHtml(agent.last_seen) + "</div>";
  html += "</div>";

  if (agent.findings.length === 0) {
    html += "<p class='muted'>No findings.</p>";
  }
  for (const finding of agent.findings) {
    html += "<div class='finding " + finding.severity + "'>" +
      "<b>" + escapeHtml(finding.rule + " - " + finding.title) + "</b>" +
      escapeHtml(finding.evidence) +
      "<div class='fix'>Fix: " + escapeHtml(finding.remediation) + "</div></div>";
  }

  const details = document.getElementById("details");
  details.innerHTML = html;
  details.hidden = false;
}

async function runScan(wanted) {
  const buttons = document.querySelectorAll("header button");
  for (const button of buttons) button.disabled = true;
  document.getElementById("banner").textContent = wanted === "machine"
    ? "Scanning your home folder - this takes up to 90 seconds..."
    : "Scanning the sample machines...";

  try {
    const response = await fetch("/api/rescan?source=" + wanted, { method: "POST" });
    const result = await response.json();
    document.getElementById("details").hidden = true;
    await load();
    if (result.scan && result.scan.stopped_early) {
      document.getElementById("banner").textContent +=
        " (stopped at the 90 second limit, so this is a partial view)";
    }
  } catch (problem) {
    document.getElementById("banner").textContent = "Scan failed: " + problem;
  }
  for (const button of buttons) button.disabled = false;
}

document.getElementById("rescan").onclick = function () { runScan(source); };
document.getElementById("useSample").onclick = function () { runScan("sample"); };
document.getElementById("useMachine").onclick = function () { runScan("machine"); };

load();
</script>
</body>
</html>
